daemon off;
master_process off;
worker_processes 1;
pid logs/nginx.pid;
error_log stderr notice;
events { worker_connections 32; }
http {
    access_log off;
    map $http_user_agent $client_group {
        default ordinary;
        lava-bench research;
    }
    add_header X-Client-Group $client_group;
    server {
        listen 127.0.0.1:18080;
        server_name benchmark.local;
        root html;
        location / { index index.html; }
    }
}
