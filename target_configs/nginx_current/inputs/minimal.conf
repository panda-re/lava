# File-backed configuration-parser seed, not an HTTP request.
daemon off;
master_process off;
worker_processes 1;
pid logs/nginx.pid;
error_log stderr notice;
events {
    worker_connections 32;
}
http {
    access_log off;
    server {
        listen 127.0.0.1:18080;
        server_name benchmark.local;
        root html;
        location / { index index.html; }
    }
}
