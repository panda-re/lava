daemon off;
master_process off;
worker_processes 1;
pid logs/nginx.pid;
error_log stderr notice;
events { worker_connections 64; }
http {
    access_log off;
    default_type application/octet-stream;
    types { text/plain txt; text/html html; }
    keepalive_timeout 0;
    client_max_body_size 64k;
    add_header X-Lava-Target nginx-config always;
    server {
        listen 127.0.0.1:18080;
        server_name benchmark.local localhost;
        root html;
        location = /index.html { expires 1h; }
        location /assets/ { autoindex on; }
        location / { index index.html; }
    }
}
